name: stridelabs_voice
description: "The client side of the StrideLabs voice protocol: the relay transport (microphone to `GET /voice/stream`), its events, limits and close codes, and the debug-line vocabulary."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2

# Extraction-ready: this package imports nothing from a host app. The relay
# transport's dependencies; the reply speaker's (just_audio, audio_session,
# dio, uuid) come with it.
dependencies:
  flutter:
    sdk: flutter

  # The microphone: PCM16 mono with the platform's voice processing.
  record: ^7.1.2
  # The relay's WebSocket (dart:io; a stub on web).
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Deterministic time for the transport's deadlines, retries and pacing.
  fake_async: ^1.3.1
  # The golden fixture's and the frozen parsers' SHA-256.
  crypto: ^3.0.6
  # Only for the frozen copy of tapper build 113's `voice_limit.dart`, which
  # imports it (test/installed_clients/); the package itself formats no text.
  intl: ^0.20.2
